<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek to Czech Transcription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-with-test {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group-with-test label {
            margin: 0;
        }

        .input-group-with-test + .input-group {
            margin-top: 0;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .output-group {
            margin-bottom: 30px;
        }

        .output {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            font-size: 16px;
            color: #333;
            white-space: pre-wrap;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            padding: 0;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: background 0.3s;
            z-index: 100;
        }

        .info-icon:hover {
            background: #5568d3;
        }

        .teacher-icon {
            right: 62px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 80vw;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .rule-details-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .rule-details-header h2 {
            margin-bottom: 20px;
        }

        .close-top-btn {
            width: auto;
            flex-shrink: 0;
            padding: 8px 14px;
            background: #667eea;
            font-size: 14px;
        }

        .modal-content p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .modal-content ul {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            padding-left: 20px;
        }

        .modal-content li {
            margin-bottom: 8px;
        }

        .complete-list-button {
            width: auto;
            margin-top: 8px;
            padding: 7px 10px;
            background: #667eea;
            font-size: 13px;
        }

        .complete-list-button:hover {
            background: #5568d3;
        }

        .rule-details {
            padding: 14px;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
        }

        .rule-details h4 {
            margin: 4px 0 8px;
            color: #333;
        }

        .rule-details table {
            width: 100%;
            margin-bottom: 14px;
            border-collapse: collapse;
        }

        .rule-details th,
        .rule-details td {
            padding: 6px 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .rule-details th {
            background: #eef0fb;
        }

        .teacher-summary-table {
            width: 100%;
            border-collapse: collapse;
        }

        .teacher-summary-table th,
        .teacher-summary-table td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
        }

        .teacher-summary-table th {
            background: #eef0fb;
        }

        .teacher-alphabet-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 14px;
        }

        .teacher-alphabet-table {
            width: 100%;
            border-collapse: collapse;
        }

        .teacher-alphabet-table th,
        .teacher-alphabet-table td {
            padding: 7px 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .teacher-alphabet-table th {
            background: #eef0fb;
        }

        .teacher-alphabet-container {
            margin-top: 14px;
        }

        .teacher-alphabet-table td {
            white-space: nowrap;
        }

        @media (max-width: 700px) {
            .teacher-alphabet-grid {
                grid-template-columns: 1fr;
            }
        }

        .teacher-summary-toggle {
            width: auto;
            padding: 8px 14px;
            font-size: 14px;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .close-btn:hover {
            background: #5568d3;
        }

        .test-button {
            padding: 8px 12px;
            background: #888;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .test-button:hover {
            background: #777;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .validation-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .validation-result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }

        .validation-result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .app-status {
            margin-bottom: 20px;
            padding: 12px 15px;
            border-radius: 8px;
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .word-diff {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 4px;
            font-family: monospace;
        }

        .word-diff.correct {
            background: #d4edda;
            color: #155724;
        }

        .word-diff.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .word-diff.missing {
            background: #fff3cd;
            color: #856404;
        }

        .validation-output {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            display: none;
            position: relative;
        }

        .validation-output.active {
            display: block;
        }

        .validation-output h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .validation-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #666;
        }

        .validation-stats span {
            margin-left: 15px;
            font-weight: 500;
        }

        .validation-stats .total {
            color: #333;
        }

        .validation-stats .correct {
            color: #28a745;
        }

        .validation-stats .incorrect {
            color: #dc3545;
        }

        .validation-text {
            color: #333;
            line-height: 1.8;
            font-size: 16px;
        }

        .word-diff {
            display: inline;
            padding: 0;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
        }

        .word-diff.correct {
            color: #333;
        }

        .word-diff.incorrect {
            color: #dc3545;
            font-weight: 500;
        }

        .word-diff.incorrect .correct-hint {
            color: #28a745;
            font-weight: normal;
        }

        .word-diff.missing {
            color: #856404;
            font-style: italic;
        }
    </style>
</head>
<body>
    <button class="info-icon" type="button" onclick="openModal()" aria-label="O aplikaci">i</button>
    <button class="info-icon teacher-icon" type="button" onclick="openTeacherModal()" aria-label="Otevřít souhrn od vyučujícího" title="Souhrn od vyučujícího">V</button>
    
    <div class="container">
        <h1>Řečtina → Čeština</h1>
        <div id="app-status" class="app-status" role="status" aria-live="polite" hidden></div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('transcriber', this)">Transkriptor</button>
            <button class="tab" onclick="switchTab('validator', this)">Validátor</button>
        </div>

        <div id="transcriber" class="tab-content active">
            <div class="input-group-with-test">
                <label for="greek-text">Řecký text:</label>
                <div class="button-group">
                    <button class="test-button" onclick="clearTranscriber()">Vymazat</button>
                    <button class="test-button" onclick="loadTestExampleTranscriber()">Testovací příklad</button>
                </div>
            </div>
            <div class="input-group">
                <textarea id="greek-text" placeholder="Zadejte řecký text..."></textarea>
            </div>

            <button onclick="transcribe()">Transkriptuj</button>

            <div class="output-group" style="margin-top: 30px;">
                <label>Česká transkripce:</label>
                <div id="output" class="output"></div>
            </div>
        </div>

        <div id="validator" class="tab-content">
            <div class="input-group-with-test">
                <label for="validator-greek">Řecký text:</label>
                <div class="button-group">
                    <button class="test-button" onclick="clearValidator()">Vymazat</button>
                    <button class="test-button" onclick="loadTestExample()">Testovací příklad</button>
                </div>
            </div>
            <div class="input-group">
                <textarea id="validator-greek" placeholder="Zadejte řecký text..."></textarea>
            </div>

            <div class="input-group">
                <label for="validator-czech">Česká transkripce:</label>
                <textarea id="validator-czech" placeholder="Zadejte českou transkripci..."></textarea>
            </div>

            <button onclick="validate()">Validuj českou transkripci</button>

            <div id="validation-output" class="validation-output">
                <h3>Výstup validace</h3>
                <div class="validation-stats">
                    <span class="total">Celkem: <span id="total-words">0</span></span>
                    <span class="correct">Správně: <span id="correct-words">0</span></span>
                    <span class="incorrect">Špatně: <span id="incorrect-words">0</span></span>
                </div>
                <div id="validation-text" class="validation-text"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2>O aplikaci</h2>
            <p>Tato aplikace provádí transkripci řeckého textu do české latinky podle phonetických pravidel.</p>
            
            <h3>Pravidla transkripce (podle priority):</h3>
            <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr style="background: #667eea; color: white;">
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">#</th>
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Pravidlo</th>
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Popis</th>
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Příklad</th>
                    </tr>
                </thead>
                <tbody id="rules-table-body"></tbody>
            </table>
            
            <button class="close-btn" onclick="closeModal()">Zavřít</button>
        </div>
    </div>

    <div class="modal" id="teacherSummaryModal" role="dialog" aria-modal="true" aria-labelledby="teacher-summary-title">
        <div class="modal-content">
            <h2 id="teacher-summary-title">Souhrn pravidel od vyučujícího</h2>
            <table class="teacher-summary-table">
                <thead>
                    <tr>
                        <th>Název</th>
                        <th>Podrobnosti</th>
                    </tr>
                </thead>
                <tbody id="teacher-summary-table-body"></tbody>
            </table>
            <button class="close-btn" onclick="closeTeacherModal()">Zavřít</button>
        </div>
    </div>

    <div class="modal" id="ruleDetailsModal" role="dialog" aria-modal="true" aria-labelledby="rule-details-title">
        <div class="modal-content">
            <div class="rule-details-header">
                <h2 id="rule-details-title"></h2>
                <button class="close-top-btn" onclick="closeRuleDetails()">Zavřít</button>
            </div>
            <div id="rule-details-content" class="rule-details"></div>
            <button class="close-btn" onclick="closeRuleDetails()">Zavřít</button>
        </div>
    </div>

    <script>
        let rules;

        function hasRule(mapping, key) {
            return Object.prototype.hasOwnProperty.call(mapping, key);
        }

        function setStatus(message) {
            const status = document.getElementById('app-status');
            status.textContent = message;
            status.hidden = !message;
        }

        function renderRules(ruleData) {
            const tableBody = document.getElementById('rules-table-body');
            tableBody.replaceChildren();

            ruleData.rule_descriptions.forEach((rule, index) => {
                const row = document.createElement('tr');
                [String(index + 1), rule.name, rule.description].forEach(value => {
                    const cell = document.createElement('td');
                    cell.style.padding = '10px';
                    cell.style.border = '1px solid #ddd';
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const exampleCell = document.createElement('td');
                exampleCell.style.padding = '10px';
                exampleCell.style.border = '1px solid #ddd';
                const example = document.createElement('div');
                example.textContent = rule.example;
                exampleCell.appendChild(example);

                if (rule.complete_data) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'complete-list-button';
                    button.textContent = 'Kompletní seznam';
                    button.addEventListener('click', () => {
                        openRuleDetails(rule, ruleData);
                    });
                    exampleCell.appendChild(button);
                }
                row.appendChild(exampleCell);

                tableBody.appendChild(row);
            });
        }

        function renderTeacherSummary(ruleData) {
            const tableBody = document.getElementById('teacher-summary-table-body');
            tableBody.replaceChildren();
            const row = document.createElement('tr');
            const name = document.createElement('td');
            name.textContent = 'Řecká AlfaBeta';
            row.appendChild(name);

            const content = document.createElement('td');
            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'teacher-summary-toggle';
            toggle.textContent = 'Zobrazit';
            toggle.setAttribute('aria-expanded', 'false');

            const alphabetContainer = document.createElement('div');
            alphabetContainer.className = 'teacher-alphabet-container';
            alphabetContainer.hidden = true;
            const alphabetGrid = document.createElement('div');
            alphabetGrid.className = 'teacher-alphabet-grid';
            const alphabet = ruleData.teacher_summary.alphabet;
            const splitIndex = Math.ceil(alphabet.length / 2);
            [alphabet.slice(0, splitIndex), alphabet.slice(splitIndex)].forEach(letters => {
                const alphabetTable = document.createElement('table');
                alphabetTable.className = 'teacher-alphabet-table';
                const head = document.createElement('thead');
                const headerRow = document.createElement('tr');
                ['Řecky', 'Přepis', 'Název'].forEach(label => {
                    const cell = document.createElement('th');
                    cell.textContent = label;
                    headerRow.appendChild(cell);
                });
                head.appendChild(headerRow);
                alphabetTable.appendChild(head);

                const body = document.createElement('tbody');
                letters.forEach(letter => {
                    const letterRow = document.createElement('tr');
                    [
                        [letter.uppercase, letter.lowercase, letter.final].filter(Boolean).join(' / '),
                        letter.latin,
                        letter.name
                    ].forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = value;
                        letterRow.appendChild(cell);
                    });
                    body.appendChild(letterRow);
                });
                alphabetTable.appendChild(body);
                alphabetGrid.appendChild(alphabetTable);
            });
            alphabetContainer.appendChild(alphabetGrid);

            toggle.addEventListener('click', () => {
                alphabetContainer.hidden = !alphabetContainer.hidden;
                toggle.textContent = alphabetContainer.hidden ? 'Zobrazit' : 'Skrýt';
                toggle.setAttribute('aria-expanded', String(!alphabetContainer.hidden));
            });
            content.appendChild(toggle);
            content.appendChild(alphabetContainer);
            row.appendChild(content);
            tableBody.appendChild(row);
        }

        function openRuleDetails(rule, ruleData) {
            document.getElementById('rule-details-title').textContent = rule.name;
            const details = document.getElementById('rule-details-content');
            details.replaceChildren();
            renderCompleteRuleData(details, rule, ruleData);
            document.getElementById('ruleDetailsModal').classList.add('active');
        }

        function closeRuleDetails() {
            document.getElementById('ruleDetailsModal').classList.remove('active');
        }

        function renderCompleteRuleData(container, rule, ruleData) {
            const sections = [
                ...(rule.complete_data.mappings || []).map(item => ({
                    ...item,
                    values: ruleData[item.key]
                })),
                ...(rule.complete_data.settings || []).map(item => ({
                    ...item,
                    values: { [item.key]: ruleData[item.key] }
                }))
            ];

            sections.forEach(section => {
                const heading = document.createElement('h4');
                heading.textContent = section.label;
                container.appendChild(heading);

                const table = document.createElement('table');
                const body = document.createElement('tbody');
                Object.entries(section.values).forEach(([source, target]) => {
                    const row = document.createElement('tr');
                    [source, Array.isArray(target) ? target.join(', ') : target].forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = String(value);
                        row.appendChild(cell);
                    });
                    body.appendChild(row);
                });
                table.appendChild(body);
                container.appendChild(table);
            });
        }

        async function loadRules() {
            try {
                const response = await fetch('rules.json');
                if (!response.ok) {
                    throw new Error(`Načtení pravidel selhalo: HTTP ${response.status}`);
                }

                const loadedRules = await response.json();
                const requiredMappings = [
                    'punctuation',
                    'combined_characters',
                    'diphthongs_with_asper',
                    'diphthongs',
                    'greek_to_latin',
                    'diaeresis_chars'
                ];
                if (requiredMappings.some(name => !loadedRules[name]) ||
                    !Array.isArray(loadedRules.vowels) ||
                    !Array.isArray(loadedRules.validation_ignored_punctuation) ||
                    !loadedRules.teacher_summary ||
                    !Array.isArray(loadedRules.teacher_summary.alphabet) ||
                    !Array.isArray(loadedRules.rule_descriptions) ||
                    loadedRules.rule_descriptions.some(rule =>
                        typeof rule.example !== 'string' ||
                        (rule.complete_data &&
                            (!Array.isArray(rule.complete_data.mappings) && !Array.isArray(rule.complete_data.settings)))) ||
                    !loadedRules.transcription_examples ||
                    typeof loadedRules.transcription_examples.greek !== 'string') {
                    throw new Error('Soubor pravidel nemá očekávanou strukturu.');
                }

                renderRules(loadedRules);
                renderTeacherSummary(loadedRules);
                rules = loadedRules;
                setStatus('');
            } catch (error) {
                console.error('Pravidla transkripce se nepodařilo načíst.', error);
                setStatus('Pravidla transkripce se nepodařilo načíst. Otevřete aplikaci přes webový server a zkuste to znovu.');
            }
        }

        function transcribe() {
            if (!rules) return;
            const greekText = document.getElementById('greek-text').value;
            document.getElementById('output').textContent = generateTranscription(greekText);
        }

        function openModal() {
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function openTeacherModal() {
            document.getElementById('teacherSummaryModal').classList.add('active');
        }

        function closeTeacherModal() {
            document.getElementById('teacherSummaryModal').classList.remove('active');
        }

        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.getElementById('ruleDetailsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRuleDetails();
            }
        });

        document.getElementById('teacherSummaryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTeacherModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeRuleDetails();
                closeTeacherModal();
                closeModal();
            }
        });

        function switchTab(tabName, tabButton) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            tabButton.classList.add('active');
        }

        function loadTestExample() {
            if (!rules) return;
            const example = rules.transcription_examples.greek;
            document.getElementById('validator-greek').value = example;
            document.getElementById('validator-czech').value = generateTranscription(example);
        }

        function clearValidator() {
            document.getElementById('validator-greek').value = '';
            document.getElementById('validator-czech').value = '';
            document.getElementById('validation-output').classList.remove('active');
        }

        function loadTestExampleTranscriber() {
            if (!rules) return;
            document.getElementById('greek-text').value = rules.transcription_examples.greek;
        }

        function clearTranscriber() {
            document.getElementById('greek-text').value = '';
            document.getElementById('output').textContent = '';
        }

        function stripValidationPunctuation(word) {
            const ignored = rules.validation_ignored_punctuation;
            let start = 0;
            let end = word.length;
            while (start < end && ignored.includes(word[start])) start++;
            while (end > start && ignored.includes(word[end - 1])) end--;
            return word.slice(start, end).normalize(rules.unicode_normalization);
        }

        function tokenize(text) {
            return text.trim().split(/\s+/).map(display => ({
                display,
                value: stripValidationPunctuation(display)
            })).filter(word => word.value);
        }

        function alignWords(expected, actual) {
            const rows = expected.length + 1;
            const columns = actual.length + 1;
            const costs = Array.from({ length: rows }, () => Array(columns).fill(0));

            for (let i = 0; i < rows; i++) costs[i][0] = i;
            for (let j = 0; j < columns; j++) costs[0][j] = j;

            for (let i = 1; i < rows; i++) {
                for (let j = 1; j < columns; j++) {
                    const substitutionCost = expected[i - 1].value === actual[j - 1].value ? 0 : 1;
                    costs[i][j] = Math.min(
                        costs[i - 1][j] + 1,
                        costs[i][j - 1] + 1,
                        costs[i - 1][j - 1] + substitutionCost
                    );
                }
            }

            const aligned = [];
            let i = expected.length;
            let j = actual.length;
            while (i > 0 || j > 0) {
                if (i > 0 && j > 0) {
                    const substitutionCost = expected[i - 1].value === actual[j - 1].value ? 0 : 1;
                    if (costs[i][j] === costs[i - 1][j - 1] + substitutionCost) {
                        aligned.push({
                            type: substitutionCost ? 'incorrect' : 'correct',
                            expected: expected[--i],
                            actual: actual[--j]
                        });
                        continue;
                    }
                }
                if (j > 0 && costs[i][j] === costs[i][j - 1] + 1) {
                    aligned.push({ type: 'extra', actual: actual[--j] });
                } else {
                    aligned.push({ type: 'missing', expected: expected[--i] });
                }
            }
            return aligned.reverse();
        }

        function appendDiffToken(container, className, text) {
            const span = document.createElement('span');
            span.className = `word-diff ${className}`;
            span.textContent = text;
            container.appendChild(span);
            container.appendChild(document.createTextNode(' '));
            return span;
        }

        function normalizeGreekText(text) {
            let normalized = '';
            let segment = '';
            for (const character of text) {
                if (hasRule(rules.punctuation, character)) {
                    normalized += segment.normalize(rules.unicode_normalization) + character;
                    segment = '';
                } else {
                    segment += character;
                }
            }
            return normalized + segment.normalize(rules.unicode_normalization);
        }

        function validate() {
            if (!rules) return;
            const greekText = document.getElementById('validator-greek').value;
            const userTranscription = document.getElementById('validator-czech').value;
            if (!greekText.trim() || !userTranscription.trim()) {
                alert('Prosím vyplňte obě pole.');
                return;
            }

            const expected = tokenize(generateTranscription(greekText));
            const actual = tokenize(userTranscription);
            const aligned = alignWords(expected, actual);
            const textDiv = document.getElementById('validation-text');
            textDiv.replaceChildren();

            let correctCount = 0;
            let incorrectCount = 0;
            aligned.forEach(item => {
                if (item.type === 'correct') {
                    appendDiffToken(textDiv, 'correct', item.actual.display);
                    correctCount++;
                } else if (item.type === 'missing') {
                    appendDiffToken(textDiv, 'missing', `(chybí: ${item.expected.display})`);
                    incorrectCount++;
                } else if (item.type === 'extra') {
                    appendDiffToken(textDiv, 'incorrect', `${item.actual.display} (nadbytečné)`);
                    incorrectCount++;
                } else {
                    const span = appendDiffToken(textDiv, 'incorrect', item.actual.display);
                    const hint = document.createElement('span');
                    hint.className = 'correct-hint';
                    hint.textContent = ` (správně: ${item.expected.display})`;
                    span.appendChild(hint);
                    incorrectCount++;
                }
            });

            document.getElementById('total-words').textContent = aligned.length;
            document.getElementById('correct-words').textContent = correctCount;
            document.getElementById('incorrect-words').textContent = incorrectCount;
            document.getElementById('validation-output').classList.add('active');
        }

        function generateTranscription(greekText) {
            const text = normalizeGreekText(greekText);
            const result = [];
            const vowels = new Set(rules.vowels);
            let i = 0;

            while (i < text.length) {
                if (i + 1 < text.length) {
                    const pair = text.slice(i, i + 2);
                    let mapped;
                    if (hasRule(rules.diphthongs_with_asper, pair)) {
                        mapped = rules.diphthongs_with_asper[pair];
                    } else {
                        const lowercasePair = pair.toLowerCase();
                        if (hasRule(rules.diphthongs_with_asper, lowercasePair)) {
                            mapped = rules.diphthongs_with_asper[lowercasePair];
                        }
                    }
                    if (mapped !== undefined) {
                        const initial = text[i] === text[i].toUpperCase() ? mapped[0].toUpperCase() : mapped[0];
                        result.push(initial + mapped.slice(1));
                        i += 2;
                        continue;
                    }

                    if (hasRule(rules.diphthongs, pair)) {
                        mapped = rules.diphthongs[pair];
                    } else if (hasRule(rules.diphthongs, pair.toLowerCase())) {
                        mapped = rules.diphthongs[pair.toLowerCase()];
                    }
                    if (mapped !== undefined) {
                        const initial = text[i] === text[i].toUpperCase() ? mapped[0].toUpperCase() : mapped[0];
                        result.push(initial + mapped.slice(1));
                        i += 2;
                        continue;
                    }
                }

                const character = text[i];
                if (hasRule(rules.punctuation, character)) {
                    result.push(rules.punctuation[character]);
                } else if (hasRule(rules.combined_characters, character)) {
                    result.push(rules.combined_characters[character]);
                } else if (hasRule(rules.diaeresis_chars, character)) {
                    const previous = result.length ? result[result.length - 1].slice(-1) : '';
                    if (previous && vowels.has(previous)) result.push('-');
                    result.push(rules.diaeresis_chars[character]);
                } else if (hasRule(rules.greek_to_latin, character)) {
                    result.push(rules.greek_to_latin[character]);
                } else {
                    result.push(character);
                }
                i++;
            }

            return result.join('');
        }

        loadRules();
    </script>
