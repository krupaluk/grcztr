<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Greek to Czech Transcription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group-with-test {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .input-group-with-test label {
            margin: 0;
        }

        .input-group-with-test + .input-group {
            margin-top: 0;
        }

        label {
            display: block;
            color: #555;
            margin-bottom: 8px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .output-group {
            margin-bottom: 30px;
        }

        .output {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            min-height: 150px;
            font-size: 16px;
            color: #333;
            white-space: pre-wrap;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .info-icon {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 32px;
            height: 32px;
            padding: 0;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            font-size: 18px;
            transition: background 0.3s;
            z-index: 100;
        }

        .info-icon:hover {
            background: #5568d3;
        }

        .teacher-icon {
            right: 62px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 16px;
            padding: 30px;
            width: 80vw;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .rule-details-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
        }

        .rule-details-header h2 {
            margin-bottom: 20px;
        }

        .close-top-btn {
            width: auto;
            flex-shrink: 0;
            padding: 8px 14px;
            background: #667eea;
            font-size: 14px;
        }

        .modal-content p {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .modal-content ul {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
            padding-left: 20px;
        }

        .modal-content li {
            margin-bottom: 8px;
        }

        .complete-list-button {
            width: auto;
            margin-top: 8px;
            padding: 7px 10px;
            background: #667eea;
            font-size: 13px;
        }

        .complete-list-button:hover {
            background: #5568d3;
        }

        .rule-details {
            padding: 14px;
            background: #f8f9fa;
            border: 1px solid #e0e0e0;
        }

        .rule-details h4 {
            margin: 4px 0 8px;
            color: #333;
        }

        .rule-details table {
            width: 100%;
            margin-bottom: 14px;
            border-collapse: collapse;
        }

        .rule-details th,
        .rule-details td {
            padding: 6px 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .rule-details th {
            background: #eef0fb;
        }

        .teacher-summary-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .teacher-summary-table th,
        .teacher-summary-table td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
            vertical-align: top;
            overflow-wrap: anywhere;
        }

        .teacher-summary-table th:first-child,
        .teacher-summary-table td:first-child {
            width: 20%;
        }

        .teacher-summary-table th {
            background: #eef0fb;
        }

        .teacher-alphabet-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
            margin-top: 14px;
        }

        .teacher-alphabet-table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }

        .teacher-alphabet-table th,
        .teacher-alphabet-table td {
            padding: 7px 10px;
            border: 1px solid #ddd;
            text-align: left;
            overflow-wrap: anywhere;
        }

        .teacher-alphabet-table th {
            background: #eef0fb;
        }

        .teacher-alphabet-container {
            margin-top: 14px;
        }

        @media (max-width: 700px) {
            .teacher-alphabet-grid {
                grid-template-columns: 1fr;
            }
        }

        .teacher-summary-toggle {
            width: auto;
            padding: 8px 14px;
            font-size: 14px;
        }

        .close-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .close-btn:hover {
            background: #5568d3;
        }

        .test-button {
            padding: 8px 12px;
            background: #888;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        .test-button:hover {
            background: #777;
        }

        .button-group {
            display: flex;
            gap: 8px;
        }

        .tabs {
            display: flex;
            margin-bottom: 30px;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            padding: 12px 24px;
            cursor: pointer;
            background: none;
            border: none;
            font-size: 16px;
            font-weight: 500;
            color: #666;
            transition: all 0.3s;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom: 2px solid #667eea;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .validation-result {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            display: none;
        }

        .validation-result.success {
            background: #d4edda;
            border: 2px solid #c3e6cb;
            color: #155724;
        }

        .validation-result.error {
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .app-status {
            margin-bottom: 20px;
            padding: 12px 15px;
            border-radius: 8px;
            background: #f8d7da;
            border: 2px solid #f5c6cb;
            color: #721c24;
        }

        .word-diff {
            display: inline-block;
            padding: 2px 6px;
            margin: 2px;
            border-radius: 4px;
            font-family: monospace;
        }

        .word-diff.correct {
            background: #d4edda;
            color: #155724;
        }

        .word-diff.incorrect {
            background: #f8d7da;
            color: #721c24;
        }

        .word-diff.missing {
            background: #fff3cd;
            color: #856404;
        }

        .validation-output {
            margin-top: 20px;
            padding: 20px;
            border-radius: 8px;
            background: #f5f5f5;
            border: 2px solid #e0e0e0;
            display: none;
            position: relative;
        }

        .validation-output.active {
            display: block;
        }

        .validation-output h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .validation-stats {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 14px;
            color: #666;
        }

        .validation-stats span {
            margin-left: 15px;
            font-weight: 500;
        }

        .validation-stats .total {
            color: #333;
        }

        .validation-stats .correct {
            color: #28a745;
        }

        .validation-stats .incorrect {
            color: #dc3545;
        }

        .validation-text {
            color: #333;
            line-height: 1.8;
            font-size: 16px;
        }

        .word-diff {
            display: inline;
            padding: 0;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
        }

        .word-diff.correct {
            color: #333;
        }

        .word-diff.incorrect {
            color: #dc3545;
            font-weight: 500;
        }

        .word-diff.incorrect .correct-hint {
            color: #28a745;
            font-weight: normal;
        }

        .word-diff.missing {
            color: #856404;
            font-style: italic;
        }
    </style>
</head>
<body>
    <button class="info-icon" type="button" onclick="openModal()" aria-label="O aplikaci">i</button>
    <button class="info-icon teacher-icon" type="button" onclick="openTeacherModal()" aria-label="Otevřít Knihu Pravidel" title="Kniha Pravidel">V</button>
    
    <div class="container">
        <h1>Řečtina → Čeština</h1>
        <div id="app-status" class="app-status" role="status" aria-live="polite" hidden></div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('transcriber', this)">Transkriptor</button>
            <button class="tab" onclick="switchTab('validator', this)">Validátor</button>
        </div>

        <div id="transcriber" class="tab-content active">
            <div class="input-group-with-test">
                <label for="greek-text">Řecký text:</label>
                <div class="button-group">
                    <button class="test-button" onclick="clearTranscriber()">Vymazat</button>
                    <button class="test-button" onclick="loadTestExampleTranscriber()">Testovací příklad</button>
                </div>
            </div>
            <div class="input-group">
                <textarea id="greek-text" placeholder="Zadejte řecký text..."></textarea>
            </div>

            <button onclick="transcribe()">Transkriptuj</button>

            <div class="output-group" style="margin-top: 30px;">
                <label>Česká transkripce:</label>
                <div id="output" class="output"></div>
            </div>
        </div>

        <div id="validator" class="tab-content">
            <div class="input-group-with-test">
                <label for="validator-greek">Řecký text:</label>
                <div class="button-group">
                    <button class="test-button" onclick="clearValidator()">Vymazat</button>
                    <button class="test-button" onclick="loadTestExample()">Testovací příklad</button>
                </div>
            </div>
            <div class="input-group">
                <textarea id="validator-greek" placeholder="Zadejte řecký text..."></textarea>
            </div>

            <div class="input-group">
                <label for="validator-czech">Česká transkripce:</label>
                <textarea id="validator-czech" placeholder="Zadejte českou transkripci..."></textarea>
            </div>

            <button onclick="validate()">Validuj českou transkripci</button>

            <div id="validation-output" class="validation-output">
                <h3>Výstup validace</h3>
                <div class="validation-stats">
                    <span class="total">Celkem: <span id="total-words">0</span></span>
                    <span class="correct">Správně: <span id="correct-words">0</span></span>
                    <span class="incorrect">Špatně: <span id="incorrect-words">0</span></span>
                </div>
                <div id="validation-text" class="validation-text"></div>
            </div>
        </div>
    </div>

    <div class="modal" id="infoModal">
        <div class="modal-content">
            <h2>O aplikaci</h2>
            <p>Tato aplikace provádí transkripci řeckého textu do české latinky podle phonetických pravidel.</p>
            
            <h3>Pravidla transkripce (podle priority):</h3>
            <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                <thead>
                    <tr style="background: #667eea; color: white;">
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">#</th>
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Pravidlo</th>
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Popis</th>
                        <th style="padding: 10px; text-align: left; border: 1px solid #ddd;">Příklad</th>
                    </tr>
                </thead>
                <tbody id="rules-table-body"></tbody>
            </table>
            
            <button class="close-btn" onclick="closeModal()">Zavřít</button>
        </div>
    </div>

    <div class="modal" id="teacherSummaryModal" role="dialog" aria-modal="true" aria-labelledby="teacher-summary-title">
        <div class="modal-content">
            <h2 id="teacher-summary-title">Kniha Pravidel</h2>
            <table class="teacher-summary-table">
                <thead>
                    <tr>
                        <th>Název</th>
                        <th>Podrobnosti</th>
                    </tr>
                </thead>
                <tbody id="teacher-summary-table-body"></tbody>
            </table>
            <button class="close-btn" onclick="closeTeacherModal()">Zavřít</button>
        </div>
    </div>

    <div class="modal" id="ruleDetailsModal" role="dialog" aria-modal="true" aria-labelledby="rule-details-title">
        <div class="modal-content">
            <div class="rule-details-header">
                <h2 id="rule-details-title"></h2>
                <button class="close-top-btn" onclick="closeRuleDetails()">Zavřít</button>
            </div>
            <div id="rule-details-content" class="rule-details"></div>
            <button class="close-btn" onclick="closeRuleDetails()">Zavřít</button>
        </div>
    </div>

    <script>
        let rules;

        function hasRule(mapping, key) {
            return Object.prototype.hasOwnProperty.call(mapping, key);
        }

        function setStatus(message) {
            const status = document.getElementById('app-status');
            status.textContent = message;
            status.hidden = !message;
        }

        function renderRules(ruleData) {
            const tableBody = document.getElementById('rules-table-body');
            tableBody.replaceChildren();

            ruleData.rule_descriptions.forEach((rule, index) => {
                const row = document.createElement('tr');
                [String(index + 1), rule.name, rule.description].forEach(value => {
                    const cell = document.createElement('td');
                    cell.style.padding = '10px';
                    cell.style.border = '1px solid #ddd';
                    cell.textContent = value;
                    row.appendChild(cell);
                });

                const exampleCell = document.createElement('td');
                exampleCell.style.padding = '10px';
                exampleCell.style.border = '1px solid #ddd';
                const example = document.createElement('div');
                example.textContent = rule.example;
                exampleCell.appendChild(example);

                if (rule.complete_data) {
                    const button = document.createElement('button');
                    button.type = 'button';
                    button.className = 'complete-list-button';
                    button.textContent = 'Kompletní seznam';
                    button.addEventListener('click', () => {
                        openRuleDetails(rule, ruleData);
                    });
                    exampleCell.appendChild(button);
                }
                row.appendChild(exampleCell);

                tableBody.appendChild(row);
            });
        }

        function renderTeacherSummary(ruleData) {
            const tableBody = document.getElementById('teacher-summary-table-body');
            tableBody.replaceChildren();
            const alphabet = ruleData.teacher_summary.alphabet;
            const splitIndex = Math.ceil(alphabet.length / 2);
            addTeacherSummarySection(tableBody, 'Řecká AlfaBeta', container => {
                const grid = document.createElement('div');
                grid.className = 'teacher-alphabet-grid';
                [alphabet.slice(0, splitIndex), alphabet.slice(splitIndex)].forEach(letters => {
                    const rows = letters.map(letter => [
                        [letter.uppercase, letter.lowercase, letter.final].filter(Boolean).join(' / '),
                        letter.latin,
                        letter.name
                    ]);
                    grid.appendChild(createTeacherTable(['Řecky', 'Přepis', 'Název'], rows));
                });
                container.appendChild(grid);
            });

            const gammaPronunciation = ruleData.teacher_summary.gamma_pronunciation;
            addTeacherSummarySection(tableBody, gammaPronunciation.name, container => {
                const description = document.createElement('p');
                description.textContent = gammaPronunciation.description;
                container.appendChild(description);

                const rows = gammaPronunciation.examples.map(example => [
                    example.greek,
                    example.pronunciation,
                    example.transcription
                ]);
                container.appendChild(createTeacherTable(['Řecký příklad', 'Výslovnost podle učebnice', 'Přepis'], rows));
            });

            addTeacherSummarySection(tableBody, 'Dvojhlásky', container => {
                const rows = ruleData.teacher_summary.diphthongs.map(diphthong => [
                    diphthong.greek,
                    diphthong.pronunciation,
                    diphthong.transcription
                ]);
                container.appendChild(createTeacherTable(['Řecky', 'Výslovnost', 'Přepis'], rows));

                const accentNote = document.createElement('p');
                accentNote.textContent = ruleData.teacher_summary.diphthong_accent_note;
                container.appendChild(accentNote);
            });

            const smoothAccent = ruleData.teacher_summary.accent.smooth;
            const smoothAccentRow = document.createElement('tr');
            const smoothAccentName = document.createElement('td');
            smoothAccentName.textContent = smoothAccent.name;
            smoothAccentRow.appendChild(smoothAccentName);
            const smoothAccentDetails = document.createElement('td');
            smoothAccentDetails.textContent = `${smoothAccent.description} Příklad: ${smoothAccent.examples}`;
            smoothAccentRow.appendChild(smoothAccentDetails);
            tableBody.appendChild(smoothAccentRow);

            const roughAccent = ruleData.teacher_summary.accent.rough;
            addTeacherSummarySection(tableBody, roughAccent.name, container => {
                const mappings = ruleData[roughAccent.diphthongs_key];
                const rows = Object.entries(mappings).map(([greek, transcription]) => [
                    greek,
                    transcription
                ]);
                container.appendChild(createTeacherTable(['Dvojhláska s ostrým přídechem', 'Přepis'], rows));

                const rhoSpecial = roughAccent.rho_special;
                const rhoDescription = document.createElement('p');
                rhoDescription.textContent = rhoSpecial.description;
                container.appendChild(rhoDescription);

                const rhoExample = document.createElement('p');
                rhoExample.textContent = rhoSpecial.example;
                container.appendChild(rhoExample);

                const rhoMappings = ruleData[rhoSpecial.mappings_key];
                const rhoRows = Object.entries(rhoMappings).map(([greek, transcription]) => [
                    greek,
                    transcription
                ]);
                container.appendChild(createTeacherTable(['Počáteční ró s ostrým přídechem', 'Přepis'], rhoRows));
            });

            addTeacherSummarySection(tableBody, 'Délka samohlásek', container => {
                const rows = ruleData.teacher_summary.vowel_lengths.map(item => [
                    item.vowels,
                    item.length
                ]);
                container.appendChild(createTeacherTable(['Samohlásky', 'Délka / přepis'], rows));

                const note = document.createElement('p');
                note.textContent = ruleData.teacher_summary.vowel_length_note;
                container.appendChild(note);
            });

            addTeacherSummarySection(tableBody, 'Interpunkce', container => {
                const rows = ruleData.teacher_summary.punctuation.map(item => [
                    item.greek,
                    item.czech
                ]);
                container.appendChild(createTeacherTable(['Řecké znaménko', 'Český zápis'], rows));

                const example = ruleData.teacher_summary.punctuation_example;
                const exampleText = document.createElement('p');
                exampleText.textContent = `${example.greek} → ${example.transcription}`;
                container.appendChild(exampleText);
            });

            const diaeresis = ruleData.teacher_summary.diaeresis;
            addTeacherSummarySection(tableBody, diaeresis.name, container => {
                const description = document.createElement('p');
                description.textContent = `${diaeresis.mark} ${diaeresis.description} Příklad: ${diaeresis.example}`;
                container.appendChild(description);
                const breathingNote = document.createElement('p');
                breathingNote.textContent = diaeresis.breathing_note;
                container.appendChild(breathingNote);

                const examples = diaeresis.examples.map(example => [
                    example.greek,
                    example.transcription
                ]);
                container.appendChild(createTeacherTable(['Řecká podoba', 'Přepis'], examples));

                const textbookExample = diaeresis.textbook_example;
                const textbookExampleText = document.createElement('p');
                textbookExampleText.textContent =
                    `Příklad z učebnice: ${textbookExample.greek} ${textbookExample.pronunciation}; přepis: ${textbookExample.transcription}`;
                container.appendChild(textbookExampleText);
            });

            const elision = ruleData.teacher_summary.elision;
            addTeacherSummarySection(tableBody, elision.name, container => {
                const description = document.createElement('p');
                description.textContent = elision.description;
                container.appendChild(description);

                const rows = elision.examples.map(example => [
                    example.greek,
                    example.transcription
                ]);
                container.appendChild(createTeacherTable(['Řecká podoba', 'Přepis'], rows));
            });

            const iotaSubscript = ruleData.teacher_summary.iota_subscript;
            addTeacherSummarySection(tableBody, iotaSubscript.name, container => {
                const description = document.createElement('p');
                description.textContent = iotaSubscript.description;
                container.appendChild(description);

                const uppercaseNote = document.createElement('p');
                uppercaseNote.textContent = iotaSubscript.uppercase_note;
                container.appendChild(uppercaseNote);

                const rows = iotaSubscript.examples.map(example => [
                    example.greek,
                    example.transcription
                ]);
                container.appendChild(createTeacherTable(['Řecká podoba', 'Přepis'], rows));
            });
        }

        function addTeacherSummarySection(tableBody, title, renderContent) {
            const row = document.createElement('tr');
            const name = document.createElement('td');
            name.textContent = title;
            row.appendChild(name);

            const details = document.createElement('td');
            const toggle = document.createElement('button');
            toggle.type = 'button';
            toggle.className = 'teacher-summary-toggle';
            toggle.textContent = 'Zobrazit';
            toggle.setAttribute('aria-expanded', 'false');

            const container = document.createElement('div');
            container.className = 'teacher-alphabet-container';
            container.hidden = true;
            renderContent(container);

            toggle.addEventListener('click', () => {
                container.hidden = !container.hidden;
                toggle.textContent = container.hidden ? 'Zobrazit' : 'Skrýt';
                toggle.setAttribute('aria-expanded', String(!container.hidden));
            });
            details.appendChild(toggle);
            details.appendChild(container);
            row.appendChild(details);
            tableBody.appendChild(row);
        }

        function createTeacherTable(headers, rows) {
            const table = document.createElement('table');
            table.className = 'teacher-alphabet-table';
            const head = document.createElement('thead');
            const headerRow = document.createElement('tr');
            headers.forEach(label => {
                const cell = document.createElement('th');
                cell.textContent = label;
                headerRow.appendChild(cell);
            });
            head.appendChild(headerRow);
            table.appendChild(head);

            const body = document.createElement('tbody');
            rows.forEach(values => {
                const row = document.createElement('tr');
                values.forEach(value => {
                    const cell = document.createElement('td');
                    cell.textContent = value;
                    row.appendChild(cell);
                });
                body.appendChild(row);
            });
            table.appendChild(body);
            return table;
        }

        function openRuleDetails(rule, ruleData) {
            document.getElementById('rule-details-title').textContent = rule.name;
            const details = document.getElementById('rule-details-content');
            details.replaceChildren();
            renderCompleteRuleData(details, rule, ruleData);
            document.getElementById('ruleDetailsModal').classList.add('active');
        }

        function closeRuleDetails() {
            document.getElementById('ruleDetailsModal').classList.remove('active');
        }

        function renderCompleteRuleData(container, rule, ruleData) {
            const sections = [
                ...(rule.complete_data.mappings || []).map(item => ({
                    ...item,
                    values: ruleData[item.key]
                })),
                ...(rule.complete_data.settings || []).map(item => ({
                    ...item,
                    values: { [item.key]: ruleData[item.key] }
                }))
            ];

            sections.forEach(section => {
                const heading = document.createElement('h4');
                heading.textContent = section.label;
                container.appendChild(heading);

                const table = document.createElement('table');
                const body = document.createElement('tbody');
                Object.entries(section.values).forEach(([source, target]) => {
                    const row = document.createElement('tr');
                    [source, Array.isArray(target) ? target.join(', ') : target].forEach(value => {
                        const cell = document.createElement('td');
                        cell.textContent = String(value);
                        row.appendChild(cell);
                    });
                    body.appendChild(row);
                });
                table.appendChild(body);
                container.appendChild(table);
            });
        }

        async function loadRules() {
            try {
                const response = await fetch('rules.json');
                if (!response.ok) {
                    throw new Error(`Načtení pravidel selhalo: HTTP ${response.status}`);
                }

                const loadedRules = await response.json();
                const requiredMappings = [
                    'punctuation',
                    'combined_characters',
                    'initial_rho_with_asper',
                    'special_word_transcriptions',
                    'gamma_nasal_clusters',
                    'diphthongs_with_asper',
                    'diphthongs',
                    'elisions',
                    'validation_equivalents',
                    'validation_suffix_equivalents',
                    'validation_character_equivalents',
                    'greek_to_latin',
                    'diaeresis_chars'
                ];
                if (requiredMappings.some(name => !loadedRules[name]) ||
                    !loadedRules.diphthong_vowel_variants ||
                    typeof loadedRules.diphthong_acute_mark !== 'string' ||
                    typeof loadedRules.rough_breathing_mark !== 'string' ||
                    !loadedRules.diphthong_accent_targets ||
                    !Array.isArray(loadedRules.vowels) ||
                    !Array.isArray(loadedRules.validation_ignored_punctuation) ||
                    !loadedRules.teacher_summary ||
                    !Array.isArray(loadedRules.teacher_summary.alphabet) ||
                    !loadedRules.teacher_summary.gamma_pronunciation ||
                    typeof loadedRules.teacher_summary.gamma_pronunciation.description !== 'string' ||
                    !Array.isArray(loadedRules.teacher_summary.gamma_pronunciation.examples) ||
                    loadedRules.teacher_summary.gamma_pronunciation.examples.some(example =>
                        typeof example.greek !== 'string' ||
                        typeof example.pronunciation !== 'string' ||
                        typeof example.transcription !== 'string') ||
                    !Array.isArray(loadedRules.teacher_summary.diphthongs) ||
                    typeof loadedRules.teacher_summary.diphthong_accent_note !== 'string' ||
                    !loadedRules.teacher_summary.accent ||
                    !loadedRules.teacher_summary.accent.rough ||
                    !loadedRules.teacher_summary.accent.smooth ||
                    typeof loadedRules.teacher_summary.accent.rough.diphthongs_key !== 'string' ||
                    !loadedRules[loadedRules.teacher_summary.accent.rough.diphthongs_key] ||
                    !loadedRules.teacher_summary.accent.rough.rho_special ||
                    typeof loadedRules.teacher_summary.accent.rough.rho_special.description !== 'string' ||
                    typeof loadedRules.teacher_summary.accent.rough.rho_special.example !== 'string' ||
                    typeof loadedRules.teacher_summary.accent.rough.rho_special.mappings_key !== 'string' ||
                    !loadedRules[loadedRules.teacher_summary.accent.rough.rho_special.mappings_key] ||
                    !Array.isArray(loadedRules.teacher_summary.vowel_lengths) ||
                    typeof loadedRules.teacher_summary.vowel_length_note !== 'string' ||
                    !Array.isArray(loadedRules.teacher_summary.punctuation) ||
                    !loadedRules.teacher_summary.punctuation_example ||
                    typeof loadedRules.teacher_summary.punctuation_example.greek !== 'string' ||
                    typeof loadedRules.teacher_summary.punctuation_example.transcription !== 'string' ||
                    !loadedRules.teacher_summary.diaeresis ||
                    typeof loadedRules.teacher_summary.diaeresis.breathing_note !== 'string' ||
                    !loadedRules.teacher_summary.diaeresis.textbook_example ||
                    typeof loadedRules.teacher_summary.diaeresis.textbook_example.greek !== 'string' ||
                    typeof loadedRules.teacher_summary.diaeresis.textbook_example.pronunciation !== 'string' ||
                    typeof loadedRules.teacher_summary.diaeresis.textbook_example.transcription !== 'string' ||
                    !Array.isArray(loadedRules.teacher_summary.diaeresis.examples) ||
                    !loadedRules.teacher_summary.elision ||
                    typeof loadedRules.teacher_summary.elision.description !== 'string' ||
                    !Array.isArray(loadedRules.teacher_summary.elision.examples) ||
                    !loadedRules.teacher_summary.iota_subscript ||
                    typeof loadedRules.teacher_summary.iota_subscript.description !== 'string' ||
                    typeof loadedRules.teacher_summary.iota_subscript.uppercase_note !== 'string' ||
                    !Array.isArray(loadedRules.teacher_summary.iota_subscript.examples) ||
                    !Array.isArray(loadedRules.rule_descriptions) ||
                    loadedRules.rule_descriptions.some(rule =>
                        typeof rule.example !== 'string' ||
                        (rule.complete_data &&
                            (!Array.isArray(rule.complete_data.mappings) && !Array.isArray(rule.complete_data.settings)))) ||
                    !loadedRules.transcription_examples ||
                    typeof loadedRules.transcription_examples.greek !== 'string' ||
                    typeof loadedRules.transcription_examples.transcription !== 'string') {
                    throw new Error('Soubor pravidel nemá očekávanou strukturu.');
                }

                renderRules(loadedRules);
                renderTeacherSummary(loadedRules);
                rules = loadedRules;
                setStatus('');
            } catch (error) {
                console.error('Pravidla transkripce se nepodařilo načíst.', error);
                setStatus('Pravidla transkripce se nepodařilo načíst. Otevřete aplikaci přes webový server a zkuste to znovu.');
            }
        }

        function transcribe() {
            if (!rules) return;
            const greekText = document.getElementById('greek-text').value;
            document.getElementById('output').textContent = generateTranscription(greekText);
        }

        function openModal() {
            document.getElementById('infoModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('infoModal').classList.remove('active');
        }

        function openTeacherModal() {
            document.getElementById('teacherSummaryModal').classList.add('active');
        }

        function closeTeacherModal() {
            document.getElementById('teacherSummaryModal').classList.remove('active');
        }

        document.getElementById('infoModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        document.getElementById('ruleDetailsModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeRuleDetails();
            }
        });

        document.getElementById('teacherSummaryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeTeacherModal();
            }
        });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeRuleDetails();
                closeTeacherModal();
                closeModal();
            }
        });

        function switchTab(tabName, tabButton) {
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            document.getElementById(tabName).classList.add('active');
            tabButton.classList.add('active');
        }

        function loadTestExample() {
            if (!rules) return;
            const example = rules.transcription_examples.greek;
            document.getElementById('validator-greek').value = example;
            document.getElementById('validator-czech').value = rules.transcription_examples.transcription;
        }

        function clearValidator() {
            document.getElementById('validator-greek').value = '';
            document.getElementById('validator-czech').value = '';
            document.getElementById('validation-output').classList.remove('active');
        }

        function loadTestExampleTranscriber() {
            if (!rules) return;
            document.getElementById('greek-text').value = rules.transcription_examples.greek;
        }

        function clearTranscriber() {
            document.getElementById('greek-text').value = '';
            document.getElementById('output').textContent = '';
        }

        function stripValidationPunctuation(word) {
            const ignored = rules.validation_ignored_punctuation;
            const characterEquivalents = rules.validation_character_equivalents;
            let normalized = word.normalize(rules.unicode_normalization);
            Object.entries(characterEquivalents).forEach(([character, equivalent]) => {
                normalized = normalized.replaceAll(character, equivalent);
            });
            if (Object.values(characterEquivalents).includes(normalized)) {
                return normalized;
            }

            let start = 0;
            let end = normalized.length;
            while (start < end && ignored.includes(normalized[start])) start++;
            while (end > start &&
                ignored.includes(normalized[end - 1]) &&
                !Object.values(characterEquivalents).includes(normalized[end - 1])) end--;
            return normalized.slice(start, end);
        }

        function tokenize(text) {
            const words = [];
            text.trim().split(/\s+/).forEach(display => {
                const parts = display.split(/(?<=['᾿])(?=[\p{L}\p{M}])/u);
                parts.forEach(part => {
                    const value = stripValidationPunctuation(part);
                    if (!value) return;

                    if (value === "'" && words.length) {
                        words[words.length - 1].display += part;
                        words[words.length - 1].value += value;
                        return;
                    }

                    words.push({ display: part, value });
                });
            });
            return words;
        }

        function alignWords(expected, actual, sourceWords = []) {
            const aligned = [];
            const wordCount = Math.max(expected.length, actual.length);
            for (let index = 0; index < wordCount; index++) {
                const expectedWord = expected[index];
                const actualWord = actual[index];
                if (expectedWord && actualWord) {
                    const sourceWord = sourceWords[index];
                    const equivalentValues = rules.validation_equivalents[expectedWord.value] || [];
                    const matchesElisionSuffix = sourceWord && Object.entries(rules.elisions)
                        .some(([greekElision, transcription]) => {
                            const sourceEnding = stripValidationPunctuation(greekElision);
                            const transcriptionSuffix = stripValidationPunctuation(transcription);
                            const alternatives = rules.validation_suffix_equivalents[transcription] || [];
                            return sourceWord.value.endsWith(sourceEnding) &&
                                expectedWord.value.endsWith(transcriptionSuffix) &&
                                alternatives.some(alternative =>
                                    actualWord.value ===
                                    expectedWord.value.slice(0, -transcriptionSuffix.length) +
                                    stripValidationPunctuation(alternative));
                        });
                    aligned.push({
                        type: expectedWord.value === actualWord.value ||
                            equivalentValues.some(equivalent =>
                                stripValidationPunctuation(equivalent) === actualWord.value) ||
                            matchesElisionSuffix ? 'correct' : 'incorrect',
                        expected: expectedWord,
                        actual: actualWord
                    });
                } else if (expectedWord) {
                    aligned.push({ type: 'missing', expected: expectedWord });
                } else {
                    aligned.push({ type: 'extra', actual: actualWord });
                }
            }
            return aligned;
        }

        function appendDiffToken(container, className, text) {
            const span = document.createElement('span');
            span.className = `word-diff ${className}`;
            span.textContent = text;
            container.appendChild(span);
            container.appendChild(document.createTextNode(' '));
            return span;
        }

        function normalizeGreekText(text) {
            let normalized = '';
            let segment = '';
            for (const character of text) {
                if (hasRule(rules.punctuation, character)) {
                    normalized += segment.normalize(rules.unicode_normalization) + character;
                    segment = '';
                } else {
                    segment += character;
                }
            }
            return normalized + segment.normalize(rules.unicode_normalization);
        }

        function validate() {
            if (!rules) return;
            const greekText = document.getElementById('validator-greek').value;
            const userTranscription = document.getElementById('validator-czech').value;
            if (!greekText.trim() || !userTranscription.trim()) {
                alert('Prosím vyplňte obě pole.');
                return;
            }

            const expected = tokenize(generateTranscription(greekText));
            const actual = tokenize(userTranscription);
            const sourceWords = tokenize(greekText);
            const aligned = alignWords(expected, actual, sourceWords);
            const textDiv = document.getElementById('validation-text');
            textDiv.replaceChildren();

            let correctCount = 0;
            let incorrectCount = 0;
            aligned.forEach(item => {
                if (item.type === 'correct') {
                    appendDiffToken(textDiv, 'correct', item.actual.display);
                    correctCount++;
                } else if (item.type === 'missing') {
                    appendDiffToken(textDiv, 'missing', `(chybí: ${item.expected.display})`);
                    incorrectCount++;
                } else if (item.type === 'extra') {
                    appendDiffToken(textDiv, 'incorrect', `${item.actual.display} (nadbytečné)`);
                    incorrectCount++;
                } else {
                    const span = appendDiffToken(textDiv, 'incorrect', item.actual.display);
                    const hint = document.createElement('span');
                    hint.className = 'correct-hint';
                    hint.textContent = ` (správně: ${item.expected.display})`;
                    span.appendChild(hint);
                    incorrectCount++;
                }
            });

            document.getElementById('total-words').textContent = aligned.length;
            document.getElementById('correct-words').textContent = correctCount;
            document.getElementById('incorrect-words').textContent = incorrectCount;
            document.getElementById('validation-output').classList.add('active');
        }

        function generateTranscription(greekText) {
            const text = normalizeGreekText(greekText);
            const result = [];
            let i = 0;

            while (i < text.length) {
                const previousCharacter = [...text.slice(0, i)].pop();
                const startsWord = !previousCharacter || !/[\p{L}\p{M}]/u.test(previousCharacter);
                if (startsWord) {
                    const specialWord = Object.keys(rules.special_word_transcriptions)
                        .find(word => text.startsWith(word, i) &&
                            (!text[i + word.length] || !/[\p{L}\p{M}]/u.test(text[i + word.length])));
                    if (specialWord) {
                        result.push(rules.special_word_transcriptions[specialWord]);
                        i += specialWord.length;
                        continue;
                    }
                }

                const initialRho = rules.initial_rho_with_asper[text[i]];
                if (startsWord && initialRho !== undefined) {
                    result.push(initialRho);
                    i++;
                    continue;
                }

                const elision = Object.keys(rules.elisions)
                    .find(sequence => text.startsWith(sequence, i));
                if (elision) {
                    const mapped = rules.elisions[elision];
                    const initial = text[i] === text[i].toUpperCase() ? mapped[0].toUpperCase() : mapped[0];
                    result.push(initial + mapped.slice(1));
                    i += elision.length;
                    continue;
                }

                if (i + 1 < text.length) {
                    const pair = text.slice(i, i + 2);
                    let mapped;
                    const lowercasePair = pair.toLowerCase();
                    if (hasRule(rules.gamma_nasal_clusters, lowercasePair)) {
                        mapped = rules.gamma_nasal_clusters[lowercasePair];
                        const initial = text[i] === text[i].toUpperCase() ? mapped[0].toUpperCase() : mapped[0];
                        result.push(initial + mapped.slice(1));
                        i += 2;
                        continue;
                    }

                    if (hasRule(rules.diphthongs_with_asper, pair)) {
                        mapped = rules.diphthongs_with_asper[pair];
                    } else {
                        if (hasRule(rules.diphthongs_with_asper, lowercasePair)) {
                            mapped = rules.diphthongs_with_asper[lowercasePair];
                        }
                    }
                    if (mapped !== undefined) {
                        mapped = preserveDiphthongAccent(mapped, pair);
                        const initial = text[i] === text[i].toUpperCase() ? mapped[0].toUpperCase() : mapped[0];
                        result.push(initial + mapped.slice(1));
                        i += 2;
                        continue;
                    }

                    const normalizedPair = [...pair]
                        .map(character => {
                            const lowercaseCharacter = character.toLowerCase();
                            return rules.diphthong_vowel_variants[lowercaseCharacter] || lowercaseCharacter;
                        })
                            .join('');
                    if (hasRule(rules.diphthongs, normalizedPair)) {
                        mapped = rules.diphthongs[normalizedPair];
                    }
                    if (mapped !== undefined) {
                        if (startsWord &&
                            pair[1].normalize('NFD').includes(rules.rough_breathing_mark)) {
                            mapped = `h${mapped}`;
                        }
                        mapped = preserveDiphthongAccent(mapped, pair);
                        const initial = text[i] === text[i].toUpperCase() ? mapped[0].toUpperCase() : mapped[0];
                        result.push(initial + mapped.slice(1));
                        i += 2;
                        continue;
                    }
                }

                const character = text[i];
                if (hasRule(rules.punctuation, character)) {
                    result.push(rules.punctuation[character]);
                } else if (hasRule(rules.combined_characters, character)) {
                    result.push(rules.combined_characters[character]);
                } else if (hasRule(rules.diaeresis_chars, character)) {
                    result.push(rules.diaeresis_chars[character]);
                } else if (hasRule(rules.greek_to_latin, character)) {
                    result.push(rules.greek_to_latin[character]);
                } else {
                    result.push(character);
                }
                i++;
            }

            return result.join('');
        }

        function preserveDiphthongAccent(transcription, greekPair) {
            const accentTargets = rules.diphthong_accent_targets;
            let result = [...transcription];

            for (let index = 0; index < greekPair.length; index++) {
                if (!greekPair[index].normalize('NFD').includes(rules.diphthong_acute_mark)) {
                    continue;
                }

                let outputIndex = -1;
                if (index === 0) {
                    outputIndex = result.findIndex(character => hasRule(accentTargets, character));
                } else {
                    for (let outputCharacterIndex = result.length - 1; outputCharacterIndex >= 0; outputCharacterIndex--) {
                        if (hasRule(accentTargets, result[outputCharacterIndex])) {
                            outputIndex = outputCharacterIndex;
                            break;
                        }
                    }
                }
                if (outputIndex !== -1) {
                    result[outputIndex] = accentTargets[result[outputIndex]];
                }
            }

            return result.join('');
        }

        loadRules();
    </script>
